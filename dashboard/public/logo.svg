<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="leftBracket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="rightBracket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Left half of hexagon -->
  <path d="M 50 12 L 22 26 L 22 64 L 50 78" fill="none" stroke="url(#leftGrad)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Right half of hexagon -->
  <path d="M 50 12 L 78 26 L 78 64 L 50 78" fill="none" stroke="url(#rightGrad)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Center divider -->
  <line x1="50" y1="12" x2="50" y2="78" stroke="#1e293b" stroke-width="0.75"/>

  <!-- Left: code bracket < -->
  <polyline points="44,39 36,45 44,51" fill="none" stroke="url(#leftBracket)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right: code bracket > -->
  <polyline points="56,39 64,45 56,51" fill="none" stroke="url(#rightBracket)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="50" y="94" text-anchor="middle" fill="#cbd5e1" font-family="Inter, -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="2.5">DUALGAUGE</text>
</svg>
